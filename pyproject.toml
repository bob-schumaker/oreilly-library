[project]
name = "oreilly-library"
version = "0.1.0"
description = "Download books from the O'Reilly library if you have access."
authors = [
    {name = "Bob Schumaker",email = "cobblers@pobox.com"}
]
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "docopt-ng (>=0.9.0,<1.0.0)",
    "selenium (>=4.41.0,<5.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "ebooklib (>=0.20,<0.21)",
    "appscript (>=1.4.0,<2.0.0)",
    "pyperclip (>=1.11.0,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.5.1,<5.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]

[tool.poetry]
packages = [
    {include = "oreilly_library", from = "src"},
]

[tool.poetry.scripts]
oreilly-library = "oreilly_library.__main__:main"
