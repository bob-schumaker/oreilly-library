[tools]
python = "3.14.3"

"pipx:poetry" = { version="latest", pyproject="{{ config_root }}/pyproject.toml" }
[env]

POETRY_ACTIVE = true
POETRY_REQUESTS_TIMEOUT = 60
POETRY_VIRTUALENVS_IN_PROJECT = true
[_.python]
venv = ".venv"

[tasks."project-update"]
run = "bash -c 'set -e; project_update_args=(poetry update --with dev); poetry_install_args=(poetry install); poetry_install_has_extras=\"\"; skip_poetry_update_extras=\"\"; for arg in \"$@\"; do if [ \"${arg}\" = \"--sync\" ]; then skip_poetry_update_extras=1; break; fi; done; project_update_args+=(\"$@\"); \"${project_update_args[@]}\"; if [ -z \"${skip_poetry_update_extras}\" ] && [ -n \"${POETRY_UPDATE_EXTRAS:-}\" ]; then for extra in ${POETRY_UPDATE_EXTRAS//,/ }; do if [ -n \"${extra}\" ]; then poetry_install_has_extras=1; poetry_install_args+=(-E \"${extra}\"); fi; done; if [ -n \"${poetry_install_has_extras}\" ]; then \"${poetry_install_args[@]}\"; fi; fi' project-update \"$@\""

# dot-mise-poetry:start
[hooks.enter]
shell = "bash"
script = '''
PROJECT_HISTFILE="${MISE_PROJECT_ROOT}/.bash_custom_history"
if [ -f "${PROJECT_HISTFILE}" ]; then
    if [ -n "${HISTFILE+x}" ] && [ "${HISTFILE}" != "${PROJECT_HISTFILE}" ]; then
        export MISE_PREVIOUS_HISTFILE="${HISTFILE}"
        export MISE_PREVIOUS_HISTFILE_SET=1
    fi
    HISTFILE="${PROJECT_HISTFILE}"
    export HISTFILE
    history -c && history -r "${HISTFILE}"
fi

if [ "$(type -t set-window-title)" = "function" ]; then
    set-window-title "${MISE_PROJECT_ROOT##*/}"
fi

export POETRY_ACTIVE=true
if [ -f "${MISE_PROJECT_ROOT}/pyproject.toml" ] && command -v poetry >/dev/null 2>&1; then
    poetry env use "$(mise which python)" >/dev/null 2>&1 || true
    eval "$(poetry env activate)" >/dev/null 2>&1 || true
    set_project_path "${MISE_PROJECT_ROOT}" "${VIRTUAL_ENV}"
fi

if [ -f "${MISE_PROJECT_ROOT}/env_setup" ]; then
    # shellcheck disable=SC1091
    source "${MISE_PROJECT_ROOT}/env_setup"
fi
'''

[hooks.leave]
shell = "bash"
script = '''
PROJECT_HISTFILE="${MISE_PROJECT_ROOT}/.bash_custom_history"
if [ -n "${HISTFILE}" ] && [ "${HISTFILE}" = "${PROJECT_HISTFILE}" ] && [ -f "${PROJECT_HISTFILE}" ]; then
    history -a "${HISTFILE}" 2>/dev/null || history -a 2>/dev/null || true
fi
if [ -n "${MISE_PREVIOUS_HISTFILE_SET}" ]; then
    HISTFILE="${MISE_PREVIOUS_HISTFILE}"
    export HISTFILE
    unset MISE_PREVIOUS_HISTFILE MISE_PREVIOUS_HISTFILE_SET
elif [ -n "${HISTFILE}" ] && [ "${HISTFILE}" = "${PROJECT_HISTFILE}" ]; then
    unset HISTFILE
fi

if [ "$(type -t set-window-title)" = "function" ]; then
    set-window-title
fi

if [ "$(type -t deactivate)" = "function" ]; then
    deactivate >/dev/null 2>&1 || true
fi
'''
# dot-mise-poetry:end
